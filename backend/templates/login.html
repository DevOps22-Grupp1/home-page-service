{% extends 'base.html' %} {% block content %}
<div style="width: 100%; max-width: 525px; margin: auto; margin-top: 4%; margin-bottom: 3%">
  {% if message %}
  <p role="alert" style="background: #fff3d6; color: black; padding: 10px 14px; border-left: 4px solid #ff9900">{{ message }}</p>
  {% endif %}
  <form method="POST" action="{{ url_for('post_login') }}">
<div class="login-wrap">
  <div class="login-html">
    <input id="tab-1" type="radio" name="tab" class="sign-in" checked><label for="tab-1" class="tab">Sign In</label>
    <input id="tab-2" type="radio" name="tab" class="sign-up"><label for="tab-2" class="tab">Sign Up</label>
    <div class="login-form">
      <div class="sign-in-htm">
        <div class="group">
          <label for="user" class="label">Username</label>
          <input id="user" name="user" type="text" class="input">
        </div>
        <div class="group">
          <label for="pass" class="label">Password</label>
          <input id="pass" name="password" type="password" class="input" data-type="password">
        </div>
        {% if demo_username %}
        <!-- The public demo account: shop without signing up (it is shared by everyone) -->
        <p class="demo-hint">
          Just looking? Log in as <strong>{{ demo_username }}</strong> with the password
          <strong>{{ demo_password }}</strong>.
        </p>
        {% endif %}
        <div class="group">
          <input type="submit" name="sign_in" class="button"  value="Sign In">
        </div>
        <div class="hr"></div>
        <div class="foot-lnk">
          <!--<a href="#">Forgot Password?</a>-->
          <a href="{{ url_for('admin_login') }}" style="color: #ccc">Admin login</a>
        </div>
      </div>
      <div class="sign-up-htm">
        <div class="group">
           <label for="user" class="label">username</label>
          <input id="user"  name="username" type="text" class="input">
        </div>
        <div class="group">
          <label for="email" class="label">Email Address</label>
          <input id="email"  name="email" type="text" class="input">
        </div>
        <div class="group">
          <label for="name" class="label">name</label>
          <input id="name"  name="name" type="text" class="input">
        </div>
        <div class="group">
          <label for="pass" class="label">Password</label>
          <input id="pass"  name="pass" type="password" class="input" data-type="password">
        </div>
        <fieldset class="group avatar-picker">
          <legend class="label">Avatar</legend>
          {% for avatar in avatars %}
          <label>
            <input type="radio" name="avatar" value="{{ avatar }}" {% if loop.first %}checked{% endif %}>
            <img src="{{ url_for('static', filename='avatars/' + avatar) }}" alt="Robot {{ loop.index }}" width="36" height="36">
          </label>
          {% endfor %}
        </fieldset>
        <!-- No role to pick: every new account is a customer. The admin logs in on /admin-login/. -->
        <div class="group">
          <input type="submit" class="button" name="sign_up" value="Sign Up">
        </div>
        <div class="hr"></div>
      </div>
    </div>
  </div>
</div>
</form>
</div>
{% endblock %}
